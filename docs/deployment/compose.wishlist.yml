# Merge these services and volumes into dynamic_sites/docker-compose.yml.
# Paths are relative to the dynamic_sites root, not this example's directory.
services:
  wishlistdb:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    env_file:
      - ./config/wishlist/db.env
    volumes:
      - wishlistdb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wishlistweb:
    image: wishlist:production
    build:
      context: ./sites/wishlist
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file:
      - ./config/wishlist/app.env
    depends_on:
      wishlistdb:
        condition: service_healthy
    volumes:
      - wishlist-storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wishlistworker:
    image: wishlist:production
    command: ["./bin/jobs"]
    restart: unless-stopped
    env_file:
      - ./config/wishlist/app.env
    depends_on:
      wishlistdb:
        condition: service_healthy
    volumes:
      - wishlist-storage:/rails/storage
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wishlistdb-data:
  wishlist-storage:
