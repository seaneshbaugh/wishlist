upstream wishlist_app {
    zone wishlist_app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server wishlistweb:3000 resolve;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mywishlist.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mywishlist.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mywishlist.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WishlistTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://wishlist_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
